name: First Tech Federal Credit Union
kind: company
description: First Tech Federal Credit Union is a federally chartered, member-owned,
  not-for-profit financial cooperative headquartered in San Jose, California, and one
  of the largest credit unions in the United States. It was founded to serve employees
  of the technology industry and their families, and its membership is drawn heavily
  from workers at major technology employers. As an NCUA-insured credit union, First
  Tech offers consumer and business deposit accounts, lending, mortgages, credit cards,
  and wealth services delivered primarily through its website and mobile apps. Like
  the vast majority of US credit unions, First Tech publishes no first-party public
  developer portal or documented open API; consumer-permissioned financial data sharing
  is handled through third-party data aggregators (such as Plaid, MX, Finicity, and
  Akoya) rather than a directly documented first-party API surface. US open finance
  is voluntary and fragmented — the Financial Data Exchange (FDX) standard and the
  CFPB Section 1033 Personal Financial Data Rights rule are still emerging — and no
  first-party FDX-conformant data-access API or published Section 1033 posture was
  found for First Tech during this review.
